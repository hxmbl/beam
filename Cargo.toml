[workspace]
members = ["beam-client", "beam-server", "beam-common"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "5.0"
home = "0.5"
which = "4.0"
shellexpand = "3.0"
tempfile = "3.8"